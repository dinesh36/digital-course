name: Auto Bump + Tag from package.json

on:
  push:
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump_and_tag:
    uses: Tattva-Design/tattva-ci-workflows/.github/workflows/node-version-update.yml@master
